<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QueueSmart — Queue History</title>
    <link rel="stylesheet" href="shared.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QueueSmart</h1>
      <p>Student services, less waiting.</p>
    </header>
    <nav aria-label="Main navigation" id="navigation"></nav>
    <main>
      <h2>Queue History</h2>
      <p id="feedback" role="status"></p>
      <p>
        Your completed or left queues appear here. New demo sessions start with
        no history.
      </p>
      <div class="table-wrap">
        <table>
          <caption>
            Past queues
          </caption>
          <thead>
            <tr>
              <th scope="col">Date joined</th>
              <th scope="col">Service</th>
              <th scope="col">Outcome</th>
            </tr>
          </thead>
          <tbody id="history-list"></tbody>
        </table>
      </div>
      <p id="history-empty"></p>
      <a href="join_queue.html">Join a new queue</a>
    </main>
    <footer>
      Assignment 2 prototype · Mock data · No backend authentication
    </footer>
  </body>
</html>
