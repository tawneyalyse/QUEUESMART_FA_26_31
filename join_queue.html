<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QueueSmart — Join a Queue</title>
    <link rel="stylesheet" href="shared.css" />
    <script src="app.js" defer></script>
    <script src="queue-page.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QueueSmart</h1>
      <p>Student services, less waiting.</p>
    </header>
    <nav aria-label="Main navigation" id="navigation"></nav>
    <main>
      <h2>Join a Queue</h2>
      <p id="feedback" role="status"></p>
      <form id="join-form">
        <label for="userEmail">Email</label>
        <input id="userEmail" type="email" name="userEmail" maxlength="254" required />
        <label for="service">Student Service</label
        ><select id="service" name="service" required>
          <option value="">Select a service</option>
        </select>
        <p id="estimate" aria-live="polite">
          Select a service to see the estimated wait.
        </p>
        <button id="join-button">Join Queue</button>
        <button id="leave-button" type="button">Leave Queue</button>
      </form>
      <h3>Current Queue</h3>
      <section id="queue-summary"></section>
    </main>
    <footer>
Queue information is kept in memory for Assignment 3.
    </footer>
  </body>
</html>
