<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QueueSmart — Service Management</title><link rel="stylesheet" href="shared.css"><script src="app.js" defer></script><script src="admin.js" defer></script></head><body><header><h1>QueueSmart</h1><p>Student services, less waiting.</p></header><nav aria-label="Main navigation" id="navigation"></nav><main><h2>Service Management</h2><p id="feedback" role="status"></p><form id="service-form"><label for="serviceName">Service name</label><input id="serviceName" name="serviceName" required maxlength="100"><label for="description">Description</label><input id="description" name="description" required maxlength="500"><label for="duration">Expected duration (minutes)</label><input id="duration" name="duration" type="number" min="1" step="1" required><label for="priority">Priority level</label><select id="priority" name="priority" required><option value="">Select priority</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select><button id="save-service">Create Service</button><button id="cancel-edit" type="button" hidden>Cancel Edit</button></form><h3>Existing services</h3><div class="table-wrap"><table><thead><tr><th scope="col">Service</th><th scope="col">Description</th><th scope="col">Duration</th><th scope="col">Priority</th><th scope="col">Action</th></tr></thead><tbody id="service-list"></tbody></table></div></main><footer>Assignment 2 prototype · Mock data · No backend authentication</footer></body></html>
